[package]
name = "rust-android-connection"
version = "0.0.0"
edition = "2021"
description = "Rust Android lifecycle and ADB command module for docker-git"
readme = "README.md"
license = "MIT"
keywords = ["docker-git", "android", "adb", "emulator", "rust"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/ProverCoderAI/rust-android-connection"
documentation = "https://github.com/ProverCoderAI/rust-android-connection"
rust-version = "1.70"

# Narrow allowlist of files shipped in the published `.crate` archive.
# Keeping this list tight prevents docs, case studies, generated CI artifacts,
# changelog fragments, and experiments from silently inflating the release
# archive past the crates.io 10 MiB upload limit. See issue #58.
include = [
    "src/**/*.rs",
    "src/web/**/*",
    "examples/**/*.rs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[lib]
name = "docker_git_android_connection"
path = "src/lib.rs"

[[bin]]
name = "rust-android-connection"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
regex = "1"
serde_json = "1"
walkdir = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
